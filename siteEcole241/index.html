<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="global.css">
    <title>site École 241</title>
  </head>
  <body>
    <!-- En-tête de la page -->
    <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
     <header>
       <!-- Le header container -->
       <div class="header-container">
         <!-- Le logo de l'École -->
         <div class="logo">
          <img src="./src/Assets/logoEcole241.png" alt="logo de l'École 241">
         </div>
          <!-- La navbar -->
          <nav class="nav">
          <!-- Les navLinks -->
            <ul>
              <li><a href="#">Accueil</a></li>
              <li><a href="#">Formations</a></li>
              <li><a href="#">Admission</a></li>
              <li><a href="#">Projets</a></li>
              <li><a href="#">Actualités</a></li>
              <li><a href="#">Contact</a></li>
            </ul>
          </nav>
            <!-- Le bouton postuler -->
             <button class="btn-postuler">Postuler</button>
        </div>
     </header>
    <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
    <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
    
    <!-- Corps de la page -->
    <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
    <main>
      <!-- LA SECTION HERO -->
      <section class="hero-section">
        <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
        <!-- La partie se trouvant à gauche contenant : Le titre, le sous-titre et les boutons -->
        <div class="part-left">
          <!-- Le titre principal du hero -->
          <h1 class="titre-hero">Devenez un professionel <br> du numérique.</h1>
          <!-- Le sous-titre du hero -->
          <p class="sous-titre-hero">Formation intensive aux métiers du digital <br> Cours du matin • Cours du soir • Gratuit.</p>
          <!-- La div Call to action avec les bouton voir les formations et postuler -->
          <div class="div-CTA">
            <button class="btn-voir-formation">Voir les formations</button>
            <button class="btn-postuler">Postuler</button>
          </div>
        </div>
        <!-- ------------------------------------------------------------------------------------------ -->
        <!-- La partie se trouvant à droite contenant : L'image ou la photo de couverture' -->
        <div class="part-right">
          <img src="./src/Assets/imageHero.png" alt="image illustrative de personnes autour d'un bureau ">
        </div>
      </section>
      <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
      
      <!-- LA SECTION STATISTIUES -->
      <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
      <section class="statistic-section">
        <!-- La carte statistiques taux d'apprenants -->
        <div class="statistic-card">
          <h2 class="titre-card">500+</h2>
          <p class="sous-titre-card">Apprenants formés</p>
        </div>
        <!-- ----------------------------------------------------- -->
        <!-- La carte statistiqus promotion -->
        <div class="statistic-card">
          <h2 class="titre-card">10+</h2>
          <p class="sous-titre-card">Promotions</p>
        </div>
        <!-- ----------------------------------------------------- -->
        <!-- La carte statistiqus taux d'insertion -->
        <div class="statistic-card">
          <h2 class="titre-card">85%</h2>
          <p class="sous-titre-card">Taux d'insertion</p>
        </div>
        <!-- ----------------------------------------------------- -->
        <!-- La carte statistiques partenaires -->
        <div class="statistic-card">
          <h2 class="titre-card">15+</h2>
          <p class="sous-titre-card">Partenaires</p>
        </div>
        <!-- ----------------------------------------------------- -->
      </section>
      <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
      
    </main>
    <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
    <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
